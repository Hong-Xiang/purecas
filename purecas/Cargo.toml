[package]
name = "purecas"
version = "0.1.0"
edition = "2021"

[dependencies]
sha2 = "0.10"
rusqlite = { version = "0.31", features = ["bundled"] }
reqwest = { version = "0.12", features = ["blocking"] }
tempfile = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = "2"
anyhow = "1"
walkdir = "2.5.0"
globset = "0.4.19"
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock"] }
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio"] }
tokio = { version = "1.53.1", default-features = false, features = ["rt-multi-thread", "net", "fs", "io-util"] }
tokio-util = { version = "0.7.19", default-features = false, features = ["io"] }
headers = "0.4.1"
mime_guess = "2.0.5"
percent-encoding = "2.3.2"
askama_escape = "0.16.0"
http = "1.4.2"
futures-util = { version = "0.3.32", default-features = false, features = ["std"] }
rustix = { version = "1.1.4", features = ["fs"] }

[dev-dependencies]
filetime = "0.2"
http-body-util = "0.1.4"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "sync", "time"] }
tower = { version = "0.5.3", features = ["util"] }
