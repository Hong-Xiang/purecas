[package]
name = "purecas"
version = "0.1.0"
edition = "2021"

[dependencies]
sha2 = "0.10"
rusqlite = { version = "0.31", features = ["bundled"] }
reqwest = { version = "0.12", features = ["blocking"] }
tempfile = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = "2"
anyhow = "1"
walkdir = "2.5.0"
globset = "0.4.19"
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock"] }
